[project]
name = "notebokki"
version = "0.1.0"
description = "Read-only MCP server that exposes registered NotebookLM notebooks to Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "notebooklm-py==0.8.4",
]

[project.scripts]
notebokki = "notebokki.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebokki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
